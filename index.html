<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="icon" type="image/x-icon" href="img/2_character_pepe/2_walk/W-21.png">
    <title>El Pollo Loco</title>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/status-bar-bottle.class.js"></script>
    <script src="models/status-bar-coin.class.js"></script>
    <script src="models/status-bar-endboss.class.js"></script>
    <script src="models/world-renderer.class.js"></script>
    <script src="models/world-base.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/coin.class.js"></script>

    <script src="models/endboss.class.js"></script>


    <script src="levels/level1.js"></script>
    <script src="models/audio-manager-base.class.js"></script>
    <script src="models/audio-manager.class.js"></script>
    <script src="js/game.js"></script>
</head>

<body onload="initStartScreen()">

    <div class="orientation-warning">
        <div class="orientation-warning-content">
            <span class="orientation-icon">↻</span>
            <h2>Please rotate your device</h2>
            <p>This game is played in landscape mode.</p>
        </div>
    </div>

    <h1 id="gameTitle" class="game-title hidden">El Pollo Loco</h1>

    <div id="fullscreen">
        <div class="sound-controls">
            <button id="musicButton" onclick="toggleMusic()">Music: ON</button>
            <button id="sfxButton" onclick="toggleSfx()">SFX: ON</button>
            <button id="fullscreenButton" class="fullscreen-button" aria-label="Fullscreen">
                ⛶
            </button>
        </div>
        <div class="game-container">
            <div id="startScreen" class="start-screen">
                <button onclick="startGame()" class="menu-button">Start Game</button>

                <a href="impressum.html" class="menu-button small-button">
                    Legal Notice
                </a>
            </div>

            <div id="gameOverOverlay" class="game-over-overlay hidden">
                <button onclick="restartGame()" class="menu-button result-button">Restart Game</button>
                <button onclick="backToMainMenu()" class="menu-button result-button">Back to Main Menu</button>

                <a href="impressum.html" class="menu-button small-button">
                    Legal Notice
                </a>
            </div>

            <div id="winnerOverlay" class="winner-overlay hidden">
                <button onclick="restartGame()" class="menu-button result-button">Restart Game</button>
                <button onclick="backToMainMenu()" class="menu-button result-button">Back to Main Menu</button>

                <a href="impressum.html" class="menu-button small-button">
                    Legal Notice
                </a>
            </div>

            <canvas id="canvas" width="720" height="480"></canvas>

            <div id="mobileControls" class="mobile-controls hidden">
                <div class="mobile-controls-left">
                    <button id="btnLeft" class="mobile-btn">←</button>
                    <button id="btnRight" class="mobile-btn">→</button>
                </div>

                <div class="mobile-controls-right">
                    <button id="btnSpace" class="mobile-btn">⤒</button>
                    <button id="btnD" class="mobile-btn">🍾</button>
                </div>
            </div>
        </div>
        <div class="controls-info">
            <span>Move: ← →</span>
            <span>Jump: ↑ / Space</span>
            <span>Throw Bottle: D</span>
        </div>
    </div>
</body>
<script src="js/script.js"></script>

</html>
